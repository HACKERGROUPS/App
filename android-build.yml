name: Android Build

# Збирає debug-APK на серверах GitHub при кожному push у main/master,
# а також вручну (вкладка Actions → Android Build → Run workflow).
# Готовий .apk лежить потім у розділі "Artifacts" цього запуску.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # У репозиторії немає gradlew/gradle-wrapper.jar (бінарник, який
      # незручно комітити вручну), тому викликаємо встановлений вище Gradle
      # напряму. Android SDK на ubuntu-latest вже є (ANDROID_HOME), тож
      # окремо його ставити не потрібно.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alerts-map-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
